services:
  bot:
    build: .
    container_name: gamedeals-bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      - flaresolverr
    volumes:
      - ./data:/app/data

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
    ports:
      - "8191:8191"
