services:
  bot:
    build: .
    container_name: gamedeals-bot
    restart: unless-stopped
    environment:
      # Required
      FLARE_SOLVER_URL: http://flaresolverr:8191
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}

      # Admin (optional — enables /stats command)
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID:-}

      # Schedule (optional, default: every 5h)
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 */5 * * *}
      SCRAPE_PAGES: ${SCRAPE_PAGES:-1}

      # Filters (optional)
      STORES: ${STORES:-Steam, Ubisoft Store, Epic Games Store, Microsoft Store, PlayStation Store, Rockstar Store}
      MIN_DISCOUNT: ${MIN_DISCOUNT:-0}
      MAX_PRICE: ${MAX_PRICE:-0}
      MIN_RATING: ${MIN_RATING:-0}
      PLATFORMS: ${PLATFORMS:-}
      FREE_ONLY: ${FREE_ONLY:-false}
      MIN_RATING_OVERRIDES: ${MIN_RATING_OVERRIDES:-}

      # Batch mode (optional, default: one msg per deal)
      SILENT_MODE: ${SILENT_MODE:-false}
    depends_on:
      flaresolverr:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
    ports:
      - "8191:8191"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8191/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 5
